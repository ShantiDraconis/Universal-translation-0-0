<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8a2be2"/>
      <stop offset="100%" stop-color="#05020a"/>
    </radialGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg)" stroke="#b388ff" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="80" fill="none" stroke="#f5f5f5" stroke-width="1" opacity="0.3"/>
  
  <!-- 0/0 symbol -->
  <text x="100" y="115" 
        font-family="Georgia, serif" 
        font-size="48" 
        fill="#f5f5f5" 
        text-anchor="middle"
        font-weight="bold">0/0</text>
  
  <!-- Subtitle arc - Universal -->
  <path id="topArc" d="M 30 100 A 70 70 0 0 1 170 100" fill="none"/>
  <text font-family="system-ui, sans-serif" font-size="10" fill="#b388ff">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">UNIVERSAL TRANSLATION</textPath>
  </text>
  
  <!-- Subtitle arc - Engine -->
  <path id="bottomArc" d="M 170 100 A 70 70 0 0 1 30 100" fill="none"/>
  <text font-family="system-ui, sans-serif" font-size="10" fill="#b388ff">
    <textPath href="#bottomArc" startOffset="50%" text-anchor="middle">ENGINE</textPath>
  </text>
  
  <!-- Decorative dots (representing universal connection) -->
  <circle cx="100" cy="30" r="3" fill="#f5f5f5"/>
  <circle cx="100" cy="170" r="3" fill="#f5f5f5"/>
  <circle cx="30" cy="100" r="3" fill="#f5f5f5"/>
  <circle cx="170" cy="100" r="3" fill="#f5f5f5"/>
</svg>
