[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-translation-00"
version = "0.1.0"
description = "Motor de Tradução Universal 0/0 - Reconstrução fonética do Harappan através de análise linguística cruzada"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Draconis", email = "draconis@example.com"}
]
keywords = [
    "harappan",
    "linguistics",
    "phonetics",
    "translation",
    "ancient-languages",
    "indus-valley",
    "dravidian",
    "proto-language",
    "universal-translation"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.0.0",
    "pydantic>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "python-Levenshtein>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
notebooks = [
    "jupyter>=1.0.0",
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.scripts]
universal-translate-00 = "universal_translation_00.cli.main:main"

[project.urls]
Homepage = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Documentation = "https://github.com/ShantiDraconis/Universal-translation-0-0/tree/main/docs"
Repository = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Issues = "https://github.com/ShantiDraconis/Universal-translation-0-0/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
