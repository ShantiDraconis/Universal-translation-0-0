[project.urls]
Homepage = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Documentation = "https://github.com/ShantiDraconis/Universal-translation-0-0/tree/main/docs"
Repository = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Issues = "https://github.com/ShantiDraconis/Universal-translation-0-0/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["universal_translation*"]

[tool.setuptools.package-data]
"universal_translation.mappings" = ["*.json"]
"universal_translation.datasets" = ["**/*.csv", "**/*.json", "**/*.md"]
"universal_translation.evaluation" = ["*.md", "*.yaml"]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
line-length = 88
target-version = ["py310", "py311", "py312"]
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "D", "UP", "B", "C4", "SIM"]
ignore = ["D100", "D104", "D203", "D213"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
