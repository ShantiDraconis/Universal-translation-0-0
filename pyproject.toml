[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "universal-translation-0-0"
version = "0.1.0"
description = "A modular framework for universal translation integrating phonemes, Harappan signs, multiple linguistic families, symbolic analysis and numerology"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Draconis", email = "draconis@example.com"}
]
keywords = [
    "translation",
    "linguistics",
    "harappan",
    "phonetics",
    "numerology",
    "symbolism",
    "universal-language"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]
docs = [
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
all = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "pydantic>=2.0.0",
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]

[project.scripts]
universal-translate = "universal_translation.api.cli:main"

[project.urls]
Homepage = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Documentation = "https://github.com/ShantiDraconis/Universal-translation-0-0#readme"
Repository = "https://github.com/ShantiDraconis/Universal-translation-0-0"
Issues = "https://github.com/ShantiDraconis/Universal-translation-0-0/issues"

[tool.setuptools.packages.find]
# universal_translation fica na raiz; universal_translation_00, ute00 e harappan_00
# ficam em src/ (os testes importam os dois grupos).
where = [".", "src"]
include = ["universal_translation*", "ute00*", "harappan_00*"]

[tool.setuptools.package-data]
"universal_translation.mappings" = ["*.json"]
"universal_translation.datasets" = ["**/*.csv", "**/*.json", "**/*.md"]
"universal_translation.evaluation" = ["*.md", "*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
