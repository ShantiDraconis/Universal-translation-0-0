name: Build Whitepaper and Site

on:
  push:
    branches: [ main ]
    paths:
      - "whitepaper/**"
      - "site/**"
      - ".github/workflows/build-whitepaper-and-site.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: whitepaper/main.tex
          working_directory: whitepaper

      - name: Upload whitepaper PDF
        uses: actions/upload-artifact@v4
        with:
          name: whitepaper-pdf
          path: whitepaper/whitepaper.pdf

      # Optional: Deploy site to GitHub Pages
